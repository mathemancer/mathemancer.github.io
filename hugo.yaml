baseURL: "https://mathemancer.com/"
title: "mathemancer"
languageCode: "en-us"
enableRobotsTXT: true
disableKinds: ["taxonomy", "term"]

pagination:
  pagerSize: 10

params:
  description: "Brent Moran — mathematics, data engineering, and code."
  github: "https://github.com/mathemancer"
  x: "https://x.com/mathemancer"
  typographtech: "https://typographtech.com"

menus:
  main:
    - name: "Blog"
      pageRef: "/blog/"
      weight: 10

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: "monokai"
