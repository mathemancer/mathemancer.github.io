# Isso configuration for local development.
#
# The production config lives on the VM at /etc/isso/isso.cfg and is derived from
# isso.cfg.template. This file is the dev-only equivalent and must not be deployed.
#
# Run from the repository root:
#   comments/.venv/bin/isso -c comments/isso-dev.cfg run
#
# The database is comments/dev.db (gitignored) and is disposable -- delete it and
# re-run comments/seed-dev.sh to return to a known state.

[general]
# Relative to the working directory, so always launch from the repository root.
dbpath = comments/dev.db

# CORS allowlist. This is the thing that breaks first: 1313 is Hugo's default port.
host =
    http://localhost:1313/
    http://127.0.0.1:1313/

notify = stdout
max-age = 1h

# Keep this off. The Gravatar path sends an MD5 of the commenter's email to a
# third party. Also note the identicon is a fixed-size square; the site restyle
# replaces it with initial-based circles in main.css.
gravatar = false

latest-enabled = false

[server]
# 8080 is already occupied on this machine, hence 8090.
listen = http://127.0.0.1:8090
public-endpoint = http://localhost:8090
samesite = Lax

[guard]
enabled = true
# Production uses ratelimit = 2 (per minute). That is right in production and
# unusable here -- you will lock yourself out within a minute of iterating on
# styles, so dev raises it. Do not carry this value to the VM.
ratelimit = 60
direct-reply = 60
# Dev-only: true. The guard blocks a reply whose parent was posted from the same
# IP within max-age ("edit time frame is still open"). The seed script posts every
# comment from 127.0.0.1, so replies would all be rejected. Production keeps this
# false -- see comments/README.md for what the guard does and does not cover.
reply-to-self = true

[moderation]
enabled = false

[admin]
enabled = true
password = dev

[markup]
renderer = mistune

# `parameters` must live in [markup.mistune]; under [markup] it warns
# "no such option". `escape` is always on regardless -- it is the XSS guard.
[markup.mistune]
parameters = escape, hard_wrap
